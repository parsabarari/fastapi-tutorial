[project]
name = "fastapi-tutorial"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "google>=3.0.0",
    "google-genai>=2.20.0",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.2",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy>=2.4.6",
    "openai>=3.6.0",
    "pinecone>=10.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
url = "https://package-mirror.liara.ir/repository/pypi/simple"
default = true

